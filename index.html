
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Demon Slayer: Endless Run</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071018;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2;font-weight:bold;text-shadow:0 2px 5px black}
.panel{background:#071018cc;padding:10px 13px;border:1px solid #5b9eb7;border-radius:12px}
#status{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#071018dd;padding:10px 14px;border-radius:10px;z-index:3;text-align:center;max-width:92%;font-size:13px}
#screen{position:fixed;inset:0;background:#06101ddd;display:flex;align-items:center;justify-content:center;z-index:5;text-align:center;padding:24px}
.card{max-width:420px;background:#102331;border:1px solid #4b9eb9;border-radius:20px;padding:26px;box-shadow:0 0 35px #00aaff33}
h1{color:#69d7ff;margin-top:0}
button{border:0;border-radius:12px;background:#d83438;color:white;font-size:17px;font-weight:bold;padding:14px 24px;margin:6px}
button:disabled{opacity:.6}
#help{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:white;background:#071018aa;padding:9px;font-size:12px;pointer-events:none}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="hud">
  <div class="panel">⚔️ Score: <span id="score">0</span></div>
  <div class="panel">❤️ Lives: <span id="lives">3</span></div>
</div>

<div id="status">Preparing game…</div>
<div id="help">Swipe ← → lanes · Swipe ↑ jump · Swipe ↓ slide</div>

<div id="screen">
  <div class="card">
    <h1>DEMON SLAYER</h1>
    <p>ENDLESS RUN</p>
    <p id="intro">Loading Tanjiro's 3D model…</p>
    <button id="start" disabled>LOADING…</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const MODEL_URL =
'https://raw.githubusercontent.com/aarushidhaked5-ctrl/demon-runner-model/main/kamado_tanjiro.glb';

const status = document.getElementById('status');
const intro = document.getElementById('intro');
const startButton = document.getElementById('start');
const screen = document.getElementById('screen');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07131b);
scene.fog = new THREE.Fog(0x07131b, 22, 100);

const camera = new THREE.PerspectiveCamera(
  60, innerWidth / innerHeight, 0.1, 250
);
camera.position.set(0, 4.3, 8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb9e9ff, 0x24301c, 2));

const moon = new THREE.DirectionalLight(0xffffff, 2.2);
moon.position.set(-5, 12, 7);
moon.castShadow = true;
scene.add(moon);

const blueLight = new THREE.PointLight(0x168bff, 16, 25);
blueLight.position.set(0, 4, -4);
scene.add(blueLight);

// Road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 240),
  new THREE.MeshStandardMaterial({color:0x252d35,roughness:0.9})
);
road.rotation.x = -Math.PI/2;
road.position.set(0,-0.06,-70);
road.receiveShadow = true;
scene.add(road);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(180,260),
  new THREE.MeshStandardMaterial({color:0x10251e})
);
ground.rotation.x = -Math.PI/2;
ground.position.set(0,-0.15,-70);
scene.add(ground);

// Lane markings
const markings = [];
for(let z=-180;z<20;z+=6){
  for(const x of [-1.67,1.67]){
    const mark = new THREE.Mesh(
      new THREE.BoxGeometry(0.055,0.025,2.5),
      new THREE.MeshBasicMaterial({color:0x9db6bc})
    );
    mark.position.set(x,0,z);
    scene.add(mark);
    markings.push(mark);
  }
}

// Forest
const trees = [];

function makeTree(x,z){
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16,0.28,2.3,7),
    new THREE.MeshStandardMaterial({color:0x54382a})
  );
  trunk.position.y = 1.15;
  tree.add(trunk);

  for(let i=0;i<3;i++){
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(1.1-i*0.18,2.4,7),
      new THREE.MeshStandardMaterial({
        color:i===0?0x123b2c:0x185039,
        roughness:1
      })
    );
    leaves.position.y = 2.5+i*0.85;
    tree.add(leaves);
  }

  tree.position.set(x,0,z);
  scene.add(tree);
  trees.push(tree);
}

for(let z=-190;z<15;z+=7){
  makeTree(-7-Math.random()*4,z);
  makeTree(7+Math.random()*4,z-2);
}

// Player
const player = new THREE.Group();
scene.add(player);
player.position.set(0,0,2);

let tanjiroModel = null;
let tanjiroMixer = null;
let modelReady = false;
let modelFailed = false;
let loadFinished = false;

const loader = new GLTFLoader();

// Model loading with progress and timeout
const loadingTimeout = setTimeout(()=>{
  if(!loadFinished){
    loadFinished = true;
    modelFailed = true;
    status.textContent = 'Model download timed out.';
    intro.textContent =
      'Tanjiro could not load. Check the model link and internet, then press Run again.';
    startButton.textContent = 'MODEL NOT LOADED';
    startButton.disabled = true;
  }
},25000);

loader.load(
  MODEL_URL,

  (gltf)=>{
    if(loadFinished && modelFailed) return;
    loadFinished = true;
    clearTimeout(loadingTimeout);

    const model = gltf.scene;
    tanjiroModel = model;

    // Model orientation from the previous version
    model.rotation.set(0,Math.PI/2,-Math.PI/2);
    model.scale.setScalar(1);
    model.position.set(0,0,0);

    model.traverse(obj=>{
      if(obj.isMesh){
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    scene.updateMatrixWorld(true);
    let bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());

    if(size.y > 0){
      model.scale.multiplyScalar(2.3/size.y);
    }

    scene.updateMatrixWorld(true);
    bounds.setFromObject(model);
    model.position.y -= bounds.min.y;

    player.add(model);

    console.log('Animation clips:',gltf.animations.length);
    console.log('Animation names:',gltf.animations.map(c=>c.name));

    if(gltf.animations.length > 0){
      tanjiroMixer = new THREE.AnimationMixer(model);

      const runClip = gltf.animations.find(clip=>
        /run|running|walk/i.test(clip.name)
      ) || gltf.animations[0];

      const action = tanjiroMixer.clipAction(runClip);
      action.reset();
      action.setLoop(THREE.LoopRepeat,Infinity);
      action.play();

      console.log('Playing animation:',runClip.name);
    }

    modelReady = true;
    status.textContent = gltf.animations.length
      ? 'Tanjiro loaded! Animation clip found.'
      : 'Tanjiro loaded! This model has no animation clips.';

    intro.textContent = 'Tanjiro is ready. Survive the demon forest!';
    startButton.disabled = false;
    startButton.textContent = 'START RUN';
  },

  (xhr)=>{
    if(xhr.total > 0){
      const percent = Math.round(xhr.loaded/xhr.total*100);
      status.textContent = `Loading Tanjiro… ${percent}%`;
    }else{
      status.textContent =
        `Downloading Tanjiro… ${(xhr.loaded/1024).toFixed(0)} KB`;
    }
  },

  (error)=>{
    if(loadFinished) return;
    loadFinished = true;
    clearTimeout(loadingTimeout);
    modelFailed = true;

    console.error('Model load error:',error);
    status.textContent = 'Tanjiro failed to load.';
    intro.textContent =
      'The model URL may be unavailable. Check the link and internet connection.';
    startButton.disabled = true;
    startButton.textContent = 'MODEL NOT LOADED';
  }
);

// Obstacles and orbs
const obstacles = [];
const orbs = [];
const effects = [];

function makeObstacle(){
  const isDemon = Math.random() < 0.55;
  const group = new THREE.Group();

  if(isDemon){
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.42,0.8,4,8),
      new THREE.MeshStandardMaterial({color:0x701f3a})
    );
    body.position.y = 0.85;
    group.add(body);

    const eyesMat = new THREE.MeshBasicMaterial({color:0xff3030});
    for(const x of [-0.16,0.16]){
      const eye = new THREE.Mesh(
        new THREE.SphereGeometry(0.065,8,8),eyesMat
      );
      eye.position.set(x,1.15,0.37);
      group.add(eye);
    }
    group.userData.kind = 'demon';
  }else{
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(1.25,0.85,0.8),
      new THREE.MeshStandardMaterial({color:0x80502c})
    );
    block.position.y = 0.43;
    group.add(block);
    group.userData.kind = 'barrier';
  }

  group.userData.hit = false;
  group.position.set([-3,0,3][Math.floor(Math.random()*3)],0,-95);
  scene.add(group);
  obstacles.push(group);
}

function makeOrb(){
  const orb = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.28,1),
    new THREE.MeshStandardMaterial({
      color:0x53e8ff,
      emissive:0x0088ff,
      emissiveIntensity:2
    })
  );
  orb.position.set([-3,0,3][Math.floor(Math.random()*3)],1.2,-90);
  orb.userData.collected = false;
  scene.add(orb);
  orbs.push(orb);
}

let lane = 0;
let score = 0;
let lives = 3;
let running = false;
let elapsed = 0;
let speed = 17;
let jumpTime = 0;
let slideTime = 0;
let spawnTimer = 0;
let orbTimer = 0;

const clock = new THREE.Clock();

function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
}

function burst(){
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.65,0.055,8,32),
    new THREE.MeshBasicMaterial({
      color:0x39dfff,
      transparent:true,
      opacity:0.95
    })
  );
  ring.position.set(player.position.x,1,player.position.z-0.4);
  ring.rotation.x = Math.PI/2;
  scene.add(ring);
  effects.push({mesh:ring,life:0.5});
}

function move(dx,dy){
  if(!running) return;

  if(Math.abs(dx)>Math.abs(dy)){
    lane = THREE.MathUtils.clamp(lane+(dx>0?1:-1),-1,1);
    burst();
  }else if(dy < -25){
    jumpTime = 0.8;
    slideTime = 0;
    burst();
  }else if(dy > 25){
    slideTime = 0.7;
    jumpTime = 0;
    burst();
  }
}

let touchX = 0;
let touchY = 0;

renderer.domElement.addEventListener('pointerdown',e=>{
  touchX = e.clientX;
  touchY = e.clientY;
});

renderer.domElement.addEventListener('pointerup',e=>{
  move(e.clientX-touchX,e.clientY-touchY);
});

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a') move(-60,0);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') move(60,0);
  if(e.key==='ArrowUp'||e.key.toLowerCase()==='w') move(0,-60);
  if(e.key==='ArrowDown'||e.key.toLowerCase()==='s') move(0,60);
});

function endGame(){
  running = false;
  screen.style.display = 'flex';
  intro.textContent = 'Run over! Final score: '+score;
  startButton.textContent = 'RUN AGAIN';
  status.textContent = 'Game over — start again when ready.';
}

function startGame(){
  if(!modelReady||modelFailed) return;

  obstacles.forEach(o=>scene.remove(o));
  orbs.forEach(o=>scene.remove(o));
  effects.forEach(e=>scene.remove(e.mesh));
  obstacles.length = 0;
  orbs.length = 0;
  effects.length = 0;

  lane = 0;
  score = 0;
  lives = 3;
  speed = 17;
  elapsed = 0;
  jumpTime = 0;
  slideTime = 0;
  spawnTimer = 0;
  orbTimer = 0;

  player.position.set(0,0,2);
  player.scale.set(1,1,1);
  if(tanjiroModel) tanjiroModel.visible = true;

  updateHUD();
  screen.style.display = 'none';
  status.textContent = 'Run, Tanjiro! ⚔️';
  running = true;
  clock.getDelta();
}

startButton.addEventListener('click',startGame);

// Main animation loop
function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),0.04);
  elapsed += dt;

  if(tanjiroMixer) tanjiroMixer.update(dt);

  if(running){
    speed = Math.min(28,17+score*0.008);

    player.position.x = THREE.MathUtils.damp(
      player.position.x,lane*3,12,dt
    );

    if(jumpTime>0){
      jumpTime -= dt;
      player.position.y =
        Math.sin((0.8-jumpTime)/0.8*Math.PI)*1.65;
    }else{
      player.position.y =
        THREE.MathUtils.damp(player.position.y,0,15,dt);
    }

    if(slideTime>0){
      slideTime -= dt;
      player.scale.y = 0.58;
    }else{
      player.scale.y = THREE.MathUtils.damp(
        player.scale.y,1,12,dt
      );
    }

    camera.position.x = THREE.MathUtils.damp(
      camera.position.x,player.position.x*0.3,3,dt
    );
    camera.lookAt(player.position.x*0.35,1.3,-5);

    markings.forEach(m=>{
      m.position.z += speed*dt;
      if(m.position.z>12) m.position.z -= 204;
    });

    trees.forEach(t=>{
      t.position.z += speed*dt;
      if(t.position.z>15) t.position.z = -190;
    });

    spawnTimer += dt;
    if(spawnTimer>1.15){
      spawnTimer = 0;
      makeObstacle();
    }

    orbTimer += dt;
    if(orbTimer>1.65){
      orbTimer = 0;
      makeOrb();
    }

    obstacles.forEach(o=>{
      o.position.z += speed*dt;

      if(o.userData.kind==='demon'){
        o.rotation.y = Math.sin(elapsed*3)*0.15;
      }

      const close =
        Math.abs(o.position.z-player.position.z)<0.85;
      const sameLane =
        Math.abs(o.position.x-player.position.x)<1.15;

      if(close&&sameLane&&!o.userData.hit){
        o.userData.hit = true;
        const avoided = jumpTime>0.12||slideTime>0.12;

        if(!avoided){
          lives--;
          updateHUD();
          burst();
          if(lives<=0) endGame();
        }
      }
    });

    for(let i=obstacles.length-1;i>=0;i--){
      if(obstacles[i].position.z>12){
        scene.remove(obstacles[i]);
        obstacles.splice(i,1);
        score += 10;
        updateHUD();
      }
    }

    orbs.forEach(o=>{
      o.position.z += speed*dt;
      o.rotation.y += dt*2;
      o.position.y = 1.2+Math.sin(elapsed*3+o.position.z)*0.15;

      if(!o.userData.collected &&
        Math.abs(o.position.z-player.position.z)<1 &&
        Math.abs(o.position.x-player.position.x)<1){
        o.userData.collected = true;
        score += 25;
        updateHUD();
        o.visible = false;
      }
    });

    for(let i=orbs.length-1;i>=0;i--){
      if(orbs[i].position.z>12||orbs[i].userData.collected){
        scene.remove(orbs[i]);
        orbs.splice(i,1);
      }
    }

    for(let i=effects.length-1;i>=0;i--){
      const effect = effects[i];
      effect.life -= dt;
      effect.mesh.scale.multiplyScalar(1+dt*2);
      effect.mesh.material.opacity = Math.max(0,effect.life*2);

      if(effect.life<=0){
        scene.remove(effect.mesh);
        effects.splice(i,1);
      }
    }
  }else{
    camera.lookAt(0,1,-5);
  }

  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
